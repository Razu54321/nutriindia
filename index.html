<style>
:root{
  --bg:#111;--surface:#1e1e1e;--card:#272727;--border:#333;

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top-bar{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top,12px))}

.top-bar p{font-size:11px;color:var(--text3);margin-top:1px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tab-bar{flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;border:none;background:none;color:var(--text3);font-size:10px;font-family:inherit;cursor:pointer;transition:color .15s}
.tab-btn .icon{font-size:21px;line-height:1}
.tab-btn.active{color:var(--accent)}
.screen{display:none;padding:12px 12px 24px}
.screen.active{display:block}
/* search */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;height:42px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--card);padding:0 12px 0 38px;font-size:14px;color:var(--text);font-family:inherit;-webkit-appearance:none}
.search-wrap input:focus{outline:none;border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:none;color:var(--text2);font-size:11px;font-family:inherit;white-space:nowrap;cursor:pointer;transition:all .15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* food rows */
.food-list{display:flex;flex-direction:column;gap:7px}
.food-row{display:flex;align-items:center;background:var(--card);border-radius:var(--radius);padding:11px 13px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s;gap:11px}
.food-row:active{background:#2e2e2e}
.food-row.selected{border-color:var(--accent)}
.food-emoji{font-size:24px;flex-shrink:0}
.food-info{flex:1;min-width:0}
.food-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-cat{font-size:10px;color:var(--text3);margin-top:2px}
.food-unit{font-size:11px;font-weight:700;color:var(--accent);flex-shrink:0}
/* detail */
.detail-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px}

.detail-title{font-size:17px;font-weight:700}

.benefit-title{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}

.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.macro-tile{background:var(--surface);border-radius:var(--radius-sm);padding:9px 5px;text-align:center}
.macro-val{font-size:16px;font-weight:700}
.macro-lbl{font-size:10px;color:var(--text3);margin-top:2px}
.bar-list{margin-bottom:12px}
.bar-item{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-lbl{font-size:11px;color:var(--text2);width:52px;flex-shrink:0}
.bar-track{flex:1;height:5px;background:#333;border-radius:3px;overflow:hidden}

.bar-val{font-size:11px;color:var(--text3);width:36px;text-align:right;flex-shrink:0}
.micro-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.micro-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.micro-tile{background:var(--surface);border-radius:var(--radius-sm);padding:7px 9px;display:flex;justify-content:space-between;align-items:center}
.micro-name{font-size:11px;color:var(--text2)}

/* plate */
.total-strip{background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,179,71,.1));border:1.5px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.total-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.total-lbl{font-size:11px;font-weight:600;color:var(--text2)}
.total-kcal{font-size:21px;font-weight:800;color:var(--accent)}
.total-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.total-m{text-align:center}
.total-mv{font-size:13px;font-weight:700}
.total-ml{font-size:9px;color:var(--text3);margin-top:1px}

.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.btn-sm{height:32px;padding:0 13px;border-radius:20px;font-size:12px;font-family:inherit;cursor:pointer}
.btn-danger{background:none;border:1.5px solid #555;color:var(--text2)}
.no-results{text-align:center;padding:18px;font-size:12px;color:var(--text3)}
#installBanner{display:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:9px 13px;font-size:12px;font-weight:600;align-items:center;gap:10px;cursor:pointer}

</style>

const CATS = [...new Set(FOODS.map(f=>f.cat))];
const EMOJIS_CAT = {Breakfast:'🥞',Eggs:'🥚',Rice:'🍚',Dal:'🫘',Paneer:'🧀',Chicken:'🍗',Vegetables:'🥦',Fruits:'🍎',Superfoods:'✨',Drinks:'🥤',Bread:'🫓',Snacks:'🥨',Dairy:'🥛',Sweets:'🍮','Fish & Mutton':'🐟',Sides:'🫙'};
let s1Cat='All', s1Selected=null, plateItems=[], tableRows=[];

function unitLabel(f){
  if(f.unit==='ml') return 'per 100ml';
  if(f.unit==='egg') return f.unitLabel||'per egg';
  return 'per 100g';
}
function unitShort(f){
  if(f.unit==='ml') return '100ml';
  if(f.unit==='egg') return 'egg';
  return '100g';
}
function tableUnitLabel(f){
  if(f.unit==='ml') return 'ml';
  if(f.unit==='egg') return 'eggs';
  return 'g';
}
function scale(f,qty){
  const r = (f.unit==='egg') ? qty : qty/100;
  return{cal:f.cal*r,prot:f.prot*r,carb:f.carb*r,fat:f.fat*r,fiber:f.fiber*r,sugar:f.sugar*r,sodium:f.sodium*r,iron:f.iron*r,calcium:f.calcium*r,vit_c:f.vit_c*r,vit_a:f.vit_a*r,potassium:f.potassium*r};
}
function fmt(v,d=1){return parseFloat(v.toFixed(d));}

// ── SINGLE ───────────────────────────────────────────────────────────────
function initChips(){
  const wrap=document.getElementById('s1-chips');
  ['All',...CATS].forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c===s1Cat?' active':'');
    b.textContent=(EMOJIS_CAT[c]||'')+' '+c;
    b.onclick=()=>{s1Cat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderSingle();};
    wrap.appendChild(b);
  });
}
function renderSingle(){
  const q=document.getElementById('s1-search').value.toLowerCase();
  const foods=FOODS.filter(f=>(!q||f.name.toLowerCase().includes(q))&&(s1Cat==='All'||f.cat===s1Cat));
  document.getElementById('s1-list').innerHTML=foods.length?foods.map(f=>`
  <div class="food-row${s1Selected===FOODS.indexOf(f)?' selected':''}" onclick="showDetail(${FOODS.indexOf(f)})">
    <span class="food-emoji">${f.emoji}</span>
    <div class="food-info"><div class="food-name">${f.name}</div><div class="food-cat">${f.cat}</div></div>
    <div class="food-unit">${f.cal} kcal<br><span style="font-size:9px;color:var(--text3)">${unitShort(f)}</span></div>
  </div>`).join(''):'<div class="no-results">No foods found</div>';
}

  <div class="detail-card">
    <div class="detail-header">

    ${f.benefit?`<div class="benefit-box"><div class="benefit-title">✅ Health Benefits</div><div class="benefit-text">${f.benefit}</div></div>`:''}
    <div class="micro-title">Macronutrients</div>

      <div class="macro-tile"><div class="macro-val" style="color:#4CAF7D">${f.fiber}g</div><div class="macro-lbl">Fiber</div></div>
    </div>
    <div class="bar-list">
      ${[['Protein',f.prot,'#5B9BD5'],['Carbs',f.carb,'#FFB347'],['Fat',f.fat,'#E05C5C'],['Fiber',f.fiber,'#4CAF7D']].map(([l,v,c])=>`
      <div class="bar-item"><div class="bar-lbl">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/mx*100)}%;background:${c}"></div></div><div class="bar-val">${v}g</div></div>`).join('')}

    <div class="micro-grid">
      <div class="micro-tile"><span class="micro-name">Sugar</span><span class="micro-val">${f.sugar}g</span></div>
      <div class="micro-tile"><span class="micro-name">Sodium</span><span class="micro-val">${f.sodium}mg</span></div>
      <div class="micro-tile"><span class="micro-name">Iron</span><span class="micro-val">${f.iron}mg</span></div>

      <div class="micro-tile"><span class="micro-name">Potassium</span><span class="micro-val">${f.potassium}mg</span></div>

}

// ── PLATE ────────────────────────────────────────────────────────────────
function renderPlateSearch(){
  const q=document.getElementById('s2-search').value.toLowerCase();
  const wrap=document.getElementById('s2-search-list');
  if(!q){wrap.innerHTML='';return;}
  const foods=FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,14);
  wrap.innerHTML=foods.map(f=>`
  <div class="food-row" onclick="addToPlate(${FOODS.indexOf(f)})">
    <span class="food-emoji">${f.emoji}</span>
    <div class="food-info"><div class="food-name">${f.name}</div><div class="food-cat">${f.cat} · ${unitLabel(f)}</div></div>
    <div class="food-unit" style="color:var(--green);font-size:12px">+ Add</div>
  </div>`).join('');
}
function addToPlate(idx){plateItems.push(idx);renderPlateDisplay();document.getElementById('s2-search').value='';document.getElementById('s2-search-list').innerHTML='';}
function removeFromPlate(i){plateItems.splice(i,1);renderPlateDisplay();}
function clearPlate(){plateItems=[];renderPlateDisplay();}
function renderPlateDisplay(){
  const wrap=document.getElementById('s2-plate');
  if(!plateItems.length){wrap.innerHTML='<div class="empty-state"><div class="e-icon">🍽️</div><p>Search a food above and tap to add it to your plate</p></div>';return;}
  const sum=k=>plateItems.reduce((a,idx)=>a+FOODS[idx][k],0);
  const tC=sum('cal'),tP=sum('prot'),tCb=sum('carb'),tF=sum('fat'),tFi=sum('fiber'),tS=sum('sodium'),tI=sum('iron'),tCa=sum('calcium');
  wrap.innerHTML=`
  <div class="total-strip">
    <div class="total-top"><div class="total-lbl">TOTAL · ${plateItems.length} item${plateItems.length>1?'s':''}</div><div class="total-kcal">${Math.round(tC)} kcal</div></div>
    <div class="total-macros">
      <div class="total-m"><div class="total-mv" style="color:#5B9BD5">${tP.toFixed(1)}g</div><div class="total-ml">Protein</div></div>
      <div class="total-m"><div class="total-mv" style="color:#FFB347">${tCb.toFixed(1)}g</div><div class="total-ml">Carbs</div></div>
      <div class="total-m"><div class="total-mv" style="color:#E05C5C">${tF.toFixed(1)}g</div><div class="total-ml">Fat</div></div>
      <div class="total-m"><div class="total-mv" style="color:#4CAF7D">${tFi.toFixed(1)}g</div><div class="total-ml">Fiber</div></div>
    </div>
  </div>
  <div class="btn-row"><button class="btn-sm btn-danger" onclick="clearPlate()">Clear plate</button></div>
  <div class="food-list">
  ${plateItems.map((idx,i)=>{const f=FOODS[idx];return`
  <div class="plate-row">
    <span style="font-size:20px">${f.emoji}</span>
    <div style="flex:1"><div class="plate-name">${f.name}</div><div class="plate-unit-info">${unitLabel(f)}</div></div>
    <div class="plate-kcal">${f.cal} kcal</div>
    <button class="plate-rm" onclick="removeFromPlate(${i})">×</button>
  </div>`;}).join('')}
  </div>`;
}

// ── TABLE ────────────────────────────────────────────────────────────────
function renderTblSearch(){
  const q=document.getElementById('s3-search').value.toLowerCase();
  const dd=document.getElementById('s3-dd');
  if(!q){dd.classList.remove('open');return;}
  const foods=FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,14);
  if(!foods.length){dd.innerHTML='<div class="dd-item"><span class="dd-imeta">No results</span></div>';dd.classList.add('open');return;}
  dd.innerHTML=foods.map(f=>`
  <div class="dd-item" onclick="addToTable(${FOODS.indexOf(f)})">
    <div><div class="dd-iname">${f.emoji} ${f.name}</div><div class="dd-imeta">${f.cat} · ${unitLabel(f)}</div></div>
    <div class="dd-kcal">${f.cal} kcal</div>
  </div>`).join('');
  dd.classList.add('open');
}
function openTblDd(){if(document.getElementById('s3-search').value)renderTblSearch();}
document.addEventListener('click',e=>{if(!e.target.closest('#s3-search')&&!e.target.closest('#s3-dd'))document.getElementById('s3-dd').classList.remove('open');});
function addToTable(idx){
  if(!tableRows.some(r=>r.idx===idx))tableRows.push({idx,qty:(FOODS[idx].unit==='egg'?1:FOODS[idx].unit==='ml'?200:100)});
  document.getElementById('s3-dd').classList.remove('open');
  document.getElementById('s3-search').value='';
  renderTable();
}
function removeFromTable(i){tableRows.splice(i,1);renderTable();}
function clearTable(){tableRows=[];renderTable();}
function updateQty(i,v){const n=parseFloat(v);if(!isNaN(n)&&n>0){tableRows[i].qty=n;renderTable();}}
function renderTable(){
  const wrap=document.getElementById('s3-table');
  if(!tableRows.length){wrap.innerHTML='<div class="empty-state"><div class="e-icon">📊</div><p>Search and add foods above to build your custom nutrition table</p></div>';return;}
  const cols=[
    {k:'cal',l:'Cal',u:'kcal'},{k:'prot',l:'Prot',u:'g'},{k:'carb',l:'Carbs',u:'g'},
    {k:'fat',l:'Fat',u:'g'},{k:'fiber',l:'Fiber',u:'g'},{k:'sugar',l:'Sugar',u:'g'},
    {k:'sodium',l:'Na',u:'mg'},{k:'iron',l:'Iron',u:'mg'},{k:'calcium',l:'Ca',u:'mg'},
    {k:'vit_c',l:'VitC',u:'mg'},{k:'potassium',l:'K',u:'mg'},
  ];
  const totals={};cols.forEach(c=>totals[c.k]=0);
  const bodyRows=tableRows.map((row,i)=>{
    const f=FOODS[row.idx];const s=scale(f,row.qty);
    cols.forEach(c=>totals[c.k]+=s[c.k]);
    return`<tr>
      <td><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">${f.emoji} ${f.name}</div><div style="font-size:9px;color:var(--text3);font-weight:400">${tableUnitLabel(f)}</div></td>
      <td><input class="qty-in" type="number" min="0.5" max="2000" step="${f.unit==='egg'?0.5:10}" value="${row.qty}" onchange="updateQty(${i},this.value)"/></td>
      ${cols.map(c=>`<td>${fmt(s[c.k])}<span style="font-size:8px;color:var(--text3)"> ${c.u}</span></td>`).join('')}
      <td><button class="rm-x" onclick="removeFromTable(${i})">×</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML=`
  <div class="btn-row"><button class="btn-sm btn-danger" onclick="clearTable()">Clear</button><span style="font-size:10px;color:var(--text3);align-self:center">Adjust quantity — totals update live</span></div>
  <div class="tbl-scroll">
    <table class="ctbl">
      <thead><tr><th>Food</th><th>Qty</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr></thead>
      <tbody>${bodyRows}
      <tr class="tbl-total"><td>TOTAL</td><td>—</td>${cols.map(c=>`<td>${fmt(totals[c.k])}<span style="font-size:8px"> ${c.u}</span></td>`).join('')}<td></td></tr>
      </tbody>
    </table>
  </div>`;
}

function switchTab(name,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+name).classList.add('active');
  btn.classList.add('active');
  document.getElementById('content').scrollTop=0;
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}document.getElementById('installBanner').classList.remove('show');});
if('serviceWorker' in navigator){
  const sw=`const C='ni-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./',location.href])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./'))));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
